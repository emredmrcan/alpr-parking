services:
  db:
    image: postgres:16-alpine
    container_name: alpr_postgres
    environment:
      POSTGRES_DB: alpr_parking
      POSTGRES_USER: alpr_user
      POSTGRES_PASSWORD: alpr_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alpr_user -d alpr_parking"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
