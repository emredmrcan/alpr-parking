# PostgreSQL is only needed when DATABASE_TYPE=postgresql.
# Start it explicitly with:  docker compose --profile postgres up -d
#
# For the default SQLite setup (DATABASE_TYPE=sqlite) you do NOT need
# to run docker compose at all — the database is a local file.

services:
  db:
    image: postgres:16-alpine
    container_name: alpr_postgres
    profiles:
      - postgres
    environment:
      POSTGRES_DB: alpr_parking
      POSTGRES_USER: alpr_user
      POSTGRES_PASSWORD: alpr_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alpr_user -d alpr_parking"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
